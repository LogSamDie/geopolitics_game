[project]
name = "geopoly"
version = "0.1.0"
description = "Geopoly backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "pymongo>=4.13",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.17",
    "pytest>=8",
    "ruff>=0.12",
]

[tool.mypy]
strict = true
files = ["app", "tests"]
explicit_package_bases = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
